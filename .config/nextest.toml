# cargo-nextest settings. nextest-version is the minimum this repository
# needs; CI installs exactly this version (.github/workflows/rust.yml).
nextest-version = "0.9.130"

[profile.default]
# A flaky protocol test is a bug: nothing is retried (nextest's default, written down).
retries = 0
# Report every failure, not only the first.
fail-fast = false
# A hang fails instead of stalling the run: a warning every minute, killed after five.
slow-timeout = { period = "60s", terminate-after = 5 }

# These run alone, their clocks tight: SyncAudit's BEAD_NET_TIMEOUT of 0.4 s, meant to cut a push
# short, caps every local fetch too, V1's stalled receive must answer within 3.5 s of a 1.5 s
# timeout, V1's helpers must start within a 0.2 s timeout, and Protocol3's fence test publishes
# within 0.25 s, by which time the remote's stalling hook must have started; tests running beside
# them can slow those fetches and pushes past the mark.
[[profile.default.overrides]]
filter = """\
    test(=protocol::sync_audit::lost_acks::claim_timeout_after_real_applied_push_is_recovered) \
    | test(=protocol::protocol3::fence_wins_against_a_real_push_still_running_after_timeout) \
    | test(=hardening::v1::v1_stalled_receive_timeouts::stalled_receive_with_a_stderr_flood_returns_within_the_timeout) \
    | test(=hardening::v1_run_git_timeout_hygiene::timeouts_leak_nothing_and_reap_as_documented)"""
threads-required = "num-cpus"

# The stress models (8 to 20 minutes each) and the full sweep (BEAD_SWEEP=full: 660 schedules,
# about 11 minutes on 16 cores and longer on fewer) outlast the five minutes after which a test
# counts as hung; each of the sweep's runs of bead still counts as hung after 180 s.
[[profile.default.overrides]]
filter = """\
    test(=sweep::sweep::sweep) \
    | test(/^stress::(root_audit_stress|concurrent_reaudit)::/)"""
slow-timeout = { period = "60s", terminate-after = 60 }

[profile.ci]
# CI keeps each test's time as evidence; timings never gate a test.

[profile.ci.junit]
path = "junit.xml"

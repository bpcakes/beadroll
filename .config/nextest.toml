# cargo-nextest settings (docs/RUST-PORT.md §4.7). nextest-version is the minimum this repository
# needs; CI installs exactly this version (.github/workflows/rust.yml).
nextest-version = "0.9.130"

[profile.default]
# A flaky protocol test is a bug: nothing is retried (nextest's default, written down).
retries = 0
# Report every failure, not only the first.
fail-fast = false
# A hang fails instead of stalling the run: a warning every minute, killed after five.
slow-timeout = { period = "60s", terminate-after = 5 }

# These run alone, their clocks tight: ActualTransportReview's BEAD_NET_TIMEOUT of 0.1 s and
# SyncAudit's of 0.4 s, meant to cut a push short, cap every local fetch too, and V1's stalled
# receive must answer within 3.5 s of a 1.5 s timeout; tests running beside them can slow those
# fetches past the mark, as they do the Python originals'.
[[profile.default.overrides]]
filter = """\
    test(=protocol::actual_transport_review::timed_out_accepted_release_returns_success) \
    | test(=protocol::sync_audit::lost_acks::claim_timeout_after_real_applied_push_is_recovered) \
    | test(=hardening::v1::v1_stalled_receive_timeouts::stalled_receive_with_a_stderr_flood_returns_within_the_timeout)"""
threads-required = "num-cpus"

# The stress models (8 to 20 minutes each) and the full sweep (BEAD_SWEEP=full: 660 schedules,
# about 11 minutes on 16 cores and longer on fewer) outlast the five minutes after which a test
# counts as hung; each of the sweep's runs of bead still counts as hung after 180 s.
[[profile.default.overrides]]
filter = """\
    test(=sweep::sweep::sweep) \
    | test(/^stress::(root_audit_stress|concurrent_reaudit)::/)"""
slow-timeout = { period = "60s", terminate-after = 60 }

[profile.ci]
# CI keeps each test's time as evidence (docs/RUST-PORT.md §4.7); timings never gate a test.

[profile.ci.junit]
path = "junit.xml"

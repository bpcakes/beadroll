[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beadroll"
description = "Beads-compatible issue tracker for coding agents working across git worktrees and machines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[project.scripts]
bead = "beadroll:main"

[tool.setuptools]
py-modules = ["beadroll"]

[tool.setuptools.dynamic]
version = {attr = "beadroll.__version__"}

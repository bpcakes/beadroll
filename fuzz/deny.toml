# fuzz/deny.toml — the root deny.toml's policy for fuzz/'s own workspace, which is never shipped:
# libfuzzer-sys carries LLVM's libFuzzer, under the NCSA licence, allowed for it alone.
[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# bead's nightly checks: the tests under the oldest git bead supports, 2.40, built from source,
# beside the newer git every push already tests with (V8_Python312's replacement); a coverage
# report of the suites, the slow ones included, kept as an artifact (roll-k2wy.14.5); the slow
# suites, the stress models, the full ownership sweep, and the growth guards only time can keep,
# timed in release (X15); and the fuzz targets of fuzz/, each for a time budget on a corpus seeded
# from what bead writes in a scratch store, a crash failing the job and kept as an artifact.
# Until the cutover the tests also ran here against Python's launcher, and the first stress model
# on a fleet that alternated the two implementations. Nothing here touches a real store or a real
# remote: every test builds its own repositories and bare remotes in a temporary directory.
name: rust-nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oldest-git:
    name: cargo nextest (ubuntu-latest, git 2.40)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_VERSION: "2.40.4"
      # kernel.org's sha256sums.asc for git-2.40.4.tar.xz
      GIT_SHA256: 8016dfeb9ba598a2e591270092b642ac70e65660606905277ea8e4c309b65d18
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      # libcurl: the transport tests reach their HTTP server through git-remote-http.
      - name: Build git ${{ env.GIT_VERSION }} from source
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.xz" -o git.tar.xz
          echo "$GIT_SHA256  git.tar.xz" | sha256sum -c -
          tar xf git.tar.xz
          make -C "git-$GIT_VERSION" -j4 prefix="$HOME/git" NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 all install > git-build.log 2>&1 || { tail -40 git-build.log; exit 1; }
          echo "$HOME/git/bin" >> "$GITHUB_PATH"
      - name: The tests run that git
        run: test "$(git --version)" = "git version $GIT_VERSION"
      - name: A git identity for the repositories the tests create
        run: |
          git config --global user.name check
          git config --global user.email check@example.invalid
      - name: Run the tests
        run: cargo nextest run --workspace --locked

  # What the fast suite, the stress models and the full sweep run of the product's code, the bead
  # processes of the black-box tests among it (`cargo xtask coverage`, xtask/src/coverage.rs): an
  # HTML report, an lcov.info and a summary.json, and the lines of the ownership protocol that no
  # test reaches on the log. cargo-llvm-cov and the toolchain's llvm-tools are not in
  # rust-toolchain.toml, so this job installs them, pinned as the other tools are. On this runner
  # the slow job's stress models take about 2 minutes, its sweep about 7 and the tests of the job
  # above about 3 (run 38874018456), without counters; 60 minutes, the job above's, is room for the
  # instrumented build and slower runs, to be corrected by the first runs of this job.
  coverage:
    name: coverage report (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
          components: llvm-tools
      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130,cargo-llvm-cov@0.8.7
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      - name: A git identity for the repositories the tests create
        run: |
          git config --global user.name check
          git config --global user.email check@example.invalid
      - name: The coverage report
        run: cargo --locked xtask coverage --stress --sweep
      # A failed suite still leaves a report, and a report of a failed run is worth reading.
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            target/coverage/html
            target/coverage/lcov.info
            target/coverage/summary.json
            target/coverage/logs
          retention-days: 30

  slow:
    name: stress models and full sweep (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      - name: A git identity for the repositories the tests create
        run: |
          git config --global user.name check
          git config --global user.email check@example.invalid
      - name: The stress models
        run: cargo nextest run --locked --package beadroll --run-ignored only -E 'test(/^stress::/)'
      - name: The full ownership sweep, all 660 schedules
        if: ${{ !cancelled() }}
        env:
          BEAD_SWEEP: full
        run: cargo nextest run --locked --package beadroll -E 'test(=sweep::sweep::sweep)'
      # One test at a time, alone on the runner: each compares two timings of its own.
      - name: The growth guards, timed in release
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --release --package xtask --run-ignored only --test-threads 1 -E 'test(/^timing::growth::/)'

  # fuzz/ is a workspace of its own on the nightly its rust-toolchain.toml pins; bead itself, which
  # writes the seed corpus, builds on the root's toolchain as everywhere else. Nothing real seeds
  # it: fuzz/seed.sh runs that bead in a scratch store, checkout and bare remote.
  fuzz:
    name: cargo fuzz (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_SECONDS: 600
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install the nightly fuzz/ pins
        working-directory: fuzz
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
          workspaces: |
            . -> target
            fuzz -> target
      - name: The fuzz targets are formatted
        run: rustfmt --check --edition 2024 fuzz/src/lib.rs fuzz/fuzz_targets/*.rs
      - name: Build bead, which writes the seed corpus
        run: cargo build --locked --package beadroll
      - name: Seed the corpus from a scratch store
        run: fuzz/seed.sh "$RUNNER_TEMP/corpus"
      - name: Build the fuzz targets
        working-directory: fuzz
        run: cargo fuzz build
      - name: Fuzz the JSON parser
        working-directory: fuzz
        run: cargo fuzz run json "$RUNNER_TEMP/corpus/json" -- -max_total_time="$FUZZ_SECONDS" -timeout=30
      - name: Fuzz the segment reader
        if: ${{ !cancelled() }}
        working-directory: fuzz
        run: cargo fuzz run segment "$RUNNER_TEMP/corpus/segment" -- -max_total_time="$FUZZ_SECONDS" -timeout=30
      - name: Fuzz the Beads importer
        if: ${{ !cancelled() }}
        working-directory: fuzz
        run: cargo fuzz run import "$RUNNER_TEMP/corpus/import" -- -max_total_time="$FUZZ_SECONDS" -timeout=30
      # libFuzzer writes the input of a crash, a timeout or a leak to fuzz/artifacts/<target>/.
      - name: Keep the inputs that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

# Cargo.toml (workspace root)
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]           # fuzz/ is its own workspace (cargo-fuzz)

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bpcakes/beadroll"
publish = false                             # nothing goes to crates.io: machines build from source

[workspace.dependencies]
beadroll-core  = { path = "crates/beadroll-core" }    # one version for every crate, above
beadroll-git   = { path = "crates/beadroll-git" }
beadroll-store = { path = "crates/beadroll-store" }
beadroll-sync  = { path = "crates/beadroll-sync" }
beadroll       = { path = "crates/beadroll" }         # xtask runs bead to count its heap
beadroll-test-support = { path = "crates/beadroll-test-support" }
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "string", "wrap_help"] }  # the command line, built from cli/spec.rs
fastrand = "2"
hashbrown = { version = "0.17", default-features = false }  # an issue's many edges indexed by their places (roll-lqjj.21): the table indexmap is built on
indexmap = "2"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["user"] }  # ~NAME in BEAD_HOME: getpwnam_r without unsafe code
regex-lite = "0.1"                          # git message classifiers
serde = { version = "1", default-features = false, features = ["std"] }  # the Deserialize core's Value implements
serde_json = { version = "1", features = ["float_roundtrip"] }  # the JSON reader (roll-lqjj.53): floats exact, as the writer prints them; core's writer stays its own
rustix = { version = "1", features = ["fs", "process", "system", "termios"] }  # termios: the terminal width help pages wrap at
sha2 = "0.10"                               # the version studio already builds
tempfile = "3"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }  # bead's own texts, wrapped by display width
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"                        # three documented exceptions, CONTRIBUTING.md
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unknown_lints = { level = "deny", priority = -10 }              # -D warnings does not catch a stale
renamed_and_removed_lints = { level = "deny", priority = -10 }  # name in these tables; these do

[workspace.lints.clippy]
cognitive_complexity = "warn"
mod_module_files = "warn"                   # CI adds -D clippy::mod_module_files
too_many_lines = "warn"
redundant_clone = "deny"
large_stack_arrays = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"                       # EPIPE-safe output only, CONTRIBUTING.md
print_stderr = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"                  # test builds are dominated by linking (studio's note)
[profile.dev.package."*"]
debug = false
[profile.dev.package.beadroll-core]
opt-level = 2                               # replay-heavy tests run in-process; keeps the debug suite fast
